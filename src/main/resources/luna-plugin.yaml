# yaml-language-server: $schema=https://raw.githubusercontent.com/thankjura/luna-schemas/refs/heads/master/luna-plugin.schema.json?v13

key: ${project.groupId}.${project.artifactId} # Resolved from pom.xml
name: ${project.name}
version: ${project.version}
description: "${project.description}"
vendor:
  name: ${project.organization.name}
  url: ${project.organization.url}
resources:
  - key: messages
    type: i18n
    path: messages
  - key: styles
    type: css
    path: frontend/frontend.css
routes:
  - routeName: adminGratyPanels # Unique route name, use it in WebItem
    routePath: panels
    component: frontend/GratyPanelsView.js # Path to compiled component
    parent: admin
scanPackages:
  - ru.slie.luna.plugins.graty # Scan packages for auto-inject components
restPackages:
  - name: Rest pack
    packages:
      - ru.slie.luna.plugins.graty.rest
activeDocs:
  - ru.slie.luna.plugins.graty.db.PanelEntity
webSections:
  - key: GratyAdminSection
    name: Graty admin section
    className: ru.slie.luna.plugins.graty.web.GratyAdminSection
webItems:
  - key: GratyAdminPanelWebItem
    name: Demo web item
    className: ru.slie.luna.plugins.graty.web.GratyAdminPanelWebItem
webPanels:
  - key: GratyWebPanel
    name: Graty web panel
    className: ru.slie.luna.plugins.graty.web.GratyWebPanel
    webComponent:
      path: frontend/GratyIssuePanelView.js
